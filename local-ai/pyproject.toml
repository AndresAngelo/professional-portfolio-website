[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "stateless-turn-orchestrator"
version = "0.1.0"
description = "Local-first stateless turn orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis==6.127.4",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["orchestrator"]
warn_unused_configs = true
